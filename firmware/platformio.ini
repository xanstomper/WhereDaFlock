; WhereDaFlock - ESP32 Flock Cam passive 2.4GHz detector
; PlatformIO configuration.
;
; Targets the Seeed XIAO ESP32-S3 by default. Adapter the board, partition,
; and pin defines to your hardware in the build_flags.

[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; 6 MB app / 1.94 MB SPIFFS / 20 KB NVS (matches the firmware layout)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -D BUZZER_PIN=3
    -D LED_PIN=21
    -D LED_ACTIVE_HIGH=0

[env:generic_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
    -D BUZZER_PIN=18
    -D LED_PIN=2
    -D LED_ACTIVE_HIGH=1