; WhereDaFlock - ESP32 Flock Cam passive detector
; PlatformIO configuration.
;
; Default target is the Seeed XIAO ESP32-S3 WiFi promiscuous detector.
; The BLE beacon scanner builds with the same env (edit src_filter below)
; or with `-e xiao_esp32s3_ble`.

[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; 6 MB app / 1.94 MB SPIFFS / 20 KB NVS (matches the firmware layout)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -D BUZZER_PIN=3
    -D LED_PIN=21
    -D LED_ACTIVE_HIGH=0

[env:xiao_esp32s3_ble]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -D BUZZER_PIN=3
    -D LED_PIN=21
    -D LED_ACTIVE_HIGH=0

[env:generic_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
    -D BUZZER_PIN=18
    -D LED_PIN=2
    -D LED_ACTIVE_HIGH=1

[env:lilygo_t_dongle_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
    -D BOARD_LILYGO_T_DONGLE_S3
    -D USE_T_DONGLE_DISPLAY
    -D USE_BUZZER=0
    -D USE_LED=1
    -D USE_APA102_LED=1
    -D APA102_DATA_PIN=40
    -D APA102_CLK_PIN=39
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^6.21.3
[env:m5stickc_plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -D USE_M5STICKC_PLUS_DISPLAY
    -D USER_SETUP_LOADED=1
    -D ST7789_2_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MOSI=15
    -D TFT_SCLK=13
    -D TFT_CS=5
    -D TFT_DC=23
    -D TFT_RST=18
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_FREQUENCY=27000000
    -D BUZZER_PIN=2
    -D LED_PIN=10
    -D LED_ACTIVE_HIGH=0
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^6.21.3

; Combined WiFi + BLE detector. Same as m5stickc_plus but with the additive,
; time-sliced BLE scan module enabled (WDF_ENABLE_BLE=1). Build/flash only if
; you intend to replace the WiFi-only firmware on the M5StickC Plus.
[env:m5stickc_plus_combined]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_custom.csv
build_flags =
    -D USE_M5STICKC_PLUS_DISPLAY
    -D USER_SETUP_LOADED=1
    -D ST7789_2_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MOSI=15
    -D TFT_SCLK=13
    -D TFT_CS=5
    -D TFT_DC=23
    -D TFT_RST=18
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_FREQUENCY=27000000
    -D BUZZER_PIN=2
    -D LED_PIN=10
    -D LED_ACTIVE_HIGH=0
    -D WDF_ENABLE_BLE=1
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^6.21.3

