; WhereDaFlock - ESP32 Flock Cam passive detector
; PlatformIO configuration.
;
; Default target is the Seeed XIAO ESP32-S3 WiFi promiscuous detector.
; The BLE beacon scanner builds with the same env (edit src_filter below)
; or with `-e xiao_esp32s3_ble`.

[platformio]
default_envs = xiao_esp32s3

; The .ino sketches live at the firmware project root (with includes like
; "src/signatures.h"). Point PlatformIO's source dir at the root so the sketch
; itself is compiled (otherwise only src/ helpers are built and setup()/loop()
; are left undefined).
src_dir = .

[env:xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; Build only the WiFi scanner sketch + its helpers; exclude the BLE sketch
; (compiled by xiao_esp32s3_ble, which pulls in ArduinoJson).
build_src_filter = +<WhereDaFlock_scanner.cpp> +<src/>

; 6 MB app / 1.94 MB SPIFFS / 20 KB NVS (matches the firmware layout)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -D BUZZER_PIN=3
    -D LED_PIN=21
    -D LED_ACTIVE_HIGH=0

[env:xiao_esp32s3_ble]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; Build only the BLE scanner sketch + its helpers.
build_src_filter = +<WhereDaFlock_ble.cpp> +<src/>
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -D BUZZER_PIN=3
    -D LED_PIN=21
    -D LED_ACTIVE_HIGH=0

[env:generic_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<WhereDaFlock_scanner.cpp> +<src/>
board_build.partitions = partitions.csv
build_flags =
    -D BUZZER_PIN=18
    -D LED_PIN=2
    -D LED_ACTIVE_HIGH=1

[env:lilygo_t_dongle_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<WhereDaFlock_scanner.cpp> +<src/>
board_build.partitions = partitions.csv
build_flags =
    -D BOARD_LILYGO_T_DONGLE_S3
    -D USE_T_DONGLE_DISPLAY
    -D USE_BUZZER=0
    -D USE_LED=1
    -D USE_APA102_LED=1
    -D APA102_DATA_PIN=40
    -D APA102_CLK_PIN=39
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
; ---------------------------------------------------------------------------
; M5Stack boards (M5StickC Plus 1.1, M5StickC, and generic M5Stack Core/Atom/
; StampS3) via the M5Unified hardware-abstraction library. These share the
; same detector source; M5Unified auto-detects LED / buzzer / button / display.
; ---------------------------------------------------------------------------

[env:m5stickc_plus]
platform = espressif32@6.9.0
board = m5stick-c            ; ESP32-PICO (same die as M5StickC & Plus 1.1)
framework = arduino
monitor_speed = 115200
build_src_filter = +<WhereDaFlock_scanner.cpp> +<src/>
build_flags =
    -D WDF_USE_M5UNIFIED=1
    -D M5STICKC_PLUS
    -D LED_PIN=10
    -D LED_ACTIVE_HIGH=0
lib_deps =
    m5stack/M5Unified@^0.2.0

[env:m5stickc_plus_ble]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
build_src_filter = +<WhereDaFlock_ble.cpp> +<src/>
lib_deps =
    m5stack/M5Unified@^0.2.0
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -D WDF_USE_M5UNIFIED=1
    -D M5STICKC_PLUS
    -D LED_PIN=10
    -D LED_ACTIVE_HIGH=0

[env:m5stickc]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
build_src_filter = +<WhereDaFlock_scanner.cpp> +<src/>
build_flags =
    -D WDF_USE_M5UNIFIED=1
lib_deps =
    m5stack/M5Unified@^0.2.0

[env:m5stack_cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
build_src_filter = +<WhereDaFlock_scanner.cpp> +<src/>
build_flags =
    -D WDF_USE_M5UNIFIED=1
lib_deps =
    m5stack/M5Unified@^0.2.0

[env:m5stack_stamps3]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_src_filter = +<WhereDaFlock_scanner.cpp> +<src/>
build_flags =
    -D WDF_USE_M5UNIFIED=1
lib_deps =
    m5stack/M5Unified@^0.2.0

; Any other M5Stack board (Core2, Atom, Fire, etc.) — override board= as needed.
[env:m5stack_generic]
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
build_src_filter = +<WhereDaFlock_scanner.cpp> +<src/>
build_flags =
    -D WDF_USE_M5UNIFIED=1
lib_deps =
    m5stack/M5Unified@^0.2.0
