; WhereDaFlock - ESP32 Flock Cam passive detector
; PlatformIO configuration.
;
; Default target is the Seeed XIAO ESP32-S3 WiFi promiscuous detector.
; The BLE beacon scanner builds with the same env (edit src_filter below)
; or with `-e xiao_esp32s3_ble`.

[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; 6 MB app / 1.94 MB SPIFFS / 20 KB NVS (matches the firmware layout)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -D BUZZER_PIN=3
    -D LED_PIN=21
    -D LED_ACTIVE_HIGH=0

[env:xiao_esp32s3_ble]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_src_filter = +<WhereDaFlock_ble.ino>
build_flags =
    -D BUZZER_PIN=3
    -D LED_PIN=21
    -D LED_ACTIVE_HIGH=0

[env:generic_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
    -D BUZZER_PIN=18
    -D LED_PIN=2
    -D LED_ACTIVE_HIGH=1

[env:lilygo_t_dongle_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
    -D BOARD_LILYGO_T_DONGLE_S3
    -D USE_T_DONGLE_DISPLAY
    -D USE_BUZZER=0
    -D USE_LED=1
    -D USE_APA102_LED=1
    -D APA102_DATA_PIN=40
    -D APA102_CLK_PIN=39
lib_deps =
    bodmer/TFT_eSPI@^2.5.43