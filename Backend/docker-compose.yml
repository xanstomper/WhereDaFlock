services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wheredaflock-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SEED_PATH=/app/data/cameras.json
      - DATABASE_URL=postgres://flock:deflockpass@db:5432/wheredaflock?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: wheredaflock-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: wheredaflock
      POSTGRES_USER: flock
      POSTGRES_PASSWORD: deflockpass
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flock -d wheredaflock"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis-data:
