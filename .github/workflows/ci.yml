name: WhereDaFlock CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  firmware-and-python-tests:
    name: Firmware & Python Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest scapy flask flask-socketio requests

      - name: Run WiFi Detection Tier Unit Tests
        run: |
          python3 firmware/tests/test_detection.py

      - name: Run BLE 0x09C8 Beacon Detection Unit Tests
        run: |
          python3 firmware/tests/test_ble_detection.py

      - name: Run Packet Analyzer Unit Tests
        run: |
          python3 firmware/tests/test_packet_analyzer.py

      - name: Run Signal Math Unit Tests
        run: |
          python3 firmware/tests/test_signal_math.py

      - name: Run Deep IE Decoder Unit Tests
        run: |
          python3 firmware/tests/test_ie_decode.py

      - name: Run Pcap Batch Aggregator Unit Tests
        run: |
          python3 firmware/tests/test_analyze_batch.py

      - name: Python Syntax & Compilation Check
        run: |
          python3 -m py_compile datasets/seed_cameras.py
          python3 -m py_compile tools/export_coreml.py
          python3 -m py_compile api/app.py
          python3 -m py_compile api/flockyou_ble.py
          python3 -m py_compile firmware/packet_analyzer.py
          python3 -m py_compile firmware/ie_decode.py
          python3 -m py_compile firmware/analyze_batch.py
          python3 -m py_compile firmware/signal_math.py

      - name: Dashboard Import / OUI Smoke Test
        run: |
          cd api && python3 -c "import app as m; assert len(m.OUI_DATABASE) > 0, 'OUI DB empty'; print('[ok]', len(m.OUI_DATABASE), 'OUI entries'); print('[ok] BLE blueprint registered')"

  backend-go-tests:
    name: Go Backend & Spatial Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: Backend/go.sum

      - name: Run Go Unit Tests
        working-directory: Backend
        run: |
          go test -v ./...

      - name: Build Go Backend Binary
        working-directory: Backend
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o wheredaflock-server ./cmd/server

  dataset-integrity:
    name: Dataset & Bundle Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate cameras.json Bundle
        run: |
          python3 -c '
          import json, os
          path = "WhereDaFlock/Resources/cameras.json"
          assert os.path.exists(path), f"Missing {path}"
          with open(path) as f:
              data = json.load(f)
          assert len(data) > 1000, f"Expected >1000 cameras, got {len(data)}"
          print(f"Validated {len(data)} bundled camera records.")
          '

  firmware-build:
    name: ESP32 Firmware Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build WiFi detector (xiao_esp32s3)
        working-directory: firmware
        run: pio run -e xiao_esp32s3

      - name: Build BLE scanner (xiao_esp32s3_ble)
        working-directory: firmware
        run: pio run -e xiao_esp32s3_ble

      - name: Build M5StickC Plus 1.1 (WiFi + BLE)
        working-directory: firmware
        run: pio run -e m5stickc_plus -e m5stickc_plus_ble

      - name: Build M5Stack family (stickc, cores3, stamps3, generic)
        working-directory: firmware
        run: pio run -e m5stickc -e m5stack_cores3 -e m5stack_stamps3 -e m5stack_generic

      - name: Build emulator test beacon (pio ci)
        working-directory: tools/emulator
        run: |
          pio ci FlockCam_emulator.ino \
            --board esp32-s3-devkitc-1 \
            --project-option "platform=espressif32@6.9.0" \
            --project-option "framework=arduino"
