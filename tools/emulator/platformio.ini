; WhereDaFlock Emulator - build & flash config
; The emitter transmits real 802.11 probe requests + a legacy BLE beacon so
; you can test the WhereDaFlock detector over the air. It runs on ANY second
; ESP32 (not the detector, not your PC's wifi radio).
;
; Build / flash (replace /dev/ttyUSB1 with your EMITTER board's port):
;   pio run -e esp32dev
;   pio run -e esp32dev -t upload --upload-port /dev/ttyUSB1
;   pio device monitor --port /dev/ttyUSB1

[platformio]
default_envs = esp32dev

; Classic ESP32 - the most common standalone emitter board.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; The emitter links WiFi + BLE together (~1.5 MB), which exceeds the classic
; default app partition. huge_app.csv frees up the full 4 MB flash for the app.
board_build.partitions = huge_app.csv

; ESP32-S3 (e.g. XIAO / generic devkit) - optional.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; M5StickC Plus - usable as an emitter too (unplug from the detector role first).
[env:m5stickc_plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200